name: prompt_verse
description: "A new Flutter project for AI Prompts"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Compatible Versions (Firebase v3 ecosystem)
  firebase_core: ^3.1.0
  onesignal_flutter: ^5.2.5
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1

  # Utilities & Image Uploads
  http: ^1.2.1
  image_picker: ^1.1.1
  video_player: ^2.9.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  
  # Native Splash Screen
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Launcher Icons Generator
  flutter_launcher_icons: ^0.13.1

# App Launcher Icon Config
# App Launcher Icon Config
flutter_launcher_icons:
  android: true
  ios: false # 👈 Yahan 'true' ko 'false' kar do
  image_path: "assets/icon.png"
  min_sdk_android: 21

# Splash Screen Config
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash.png"
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/splash.png
    - assets/company_logo.png
    - assets/signature.png