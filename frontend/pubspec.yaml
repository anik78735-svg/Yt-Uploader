name: yt_uploader_frontend
description: Premium Flutter frontend for scheduled YouTube uploads.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  http: ^1.2.0
  google_sign_in: ^6.1.0
  shared_preferences: ^2.0.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.1.0
  flutter_web_auth_2: ^5.0.3
  dio: ^5.4.0
  file_picker: ^12.0.0-beta.7
  share_plus: ^13.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
